<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Examify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand" style="text-decoration:none;">
        <div class="brand-icon">🎓</div>
        <span>Examify</span>
      </a>
    </div>
  </nav>

  <main class="container" style="display:flex; justify-content:center; padding: 3rem 1rem;">
    <div class="card" style="width:100%; max-width:460px;">
      <div style="display:flex; gap:.5rem; margin-bottom:1.5rem;">
        <button type="button" id="tabLogin" class="btn btn-primary btn-block">Login</button>
        <button type="button" id="tabRegister" class="btn btn-secondary btn-block">Register</button>
      </div>

      <div id="authError" class="badge badge-danger" style="display:none; width:100%; white-space:normal; margin-bottom:1rem; padding:.6rem .8rem;"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Login →</button>

        <div style="margin-top:1.25rem; font-size:.85rem; color:var(--text-muted);">
          Demo accounts (click to fill):
          <div style="display:flex; gap:.5rem; margin-top:.5rem;">
            <button type="button" class="btn btn-secondary btn-sm" id="fillStudent">Student demo</button>
            <button type="button" class="btn btn-secondary btn-sm" id="fillTeacher">Teacher demo</button>
          </div>
        </div>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display:none;" novalidate>
        <div class="form-group">
          <label class="form-label" for="regName">Full Name *</label>
          <input type="text" id="regName" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regEmail">Email *</label>
          <input type="email" id="regEmail" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regRole">I am a *</label>
          <select id="regRole" class="form-input">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>
        <div class="form-group" id="rollGroup">
          <label class="form-label" for="regRoll">Roll Number *</label>
          <input type="text" id="regRoll" class="form-input" placeholder="e.g. CS2024010">
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Password * (min 6 chars)</label>
          <input type="password" id="regPassword" class="form-input" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account →</button>
      </form>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
